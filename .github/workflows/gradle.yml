name: Java engine tests

on:
  push:
    paths:
      - "**"
      - ".github/workflows/gradle.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/gradle.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: "**/*.gradle.kts"
      - name: Run headless engine tests
        run: ./gradlew --no-daemon test
