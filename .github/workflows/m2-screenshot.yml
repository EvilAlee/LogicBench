name: M2 screenshot capture

on:
  push:
    branches:
      - m2-window
    paths:
      - ".github/workflows/m2-screenshot.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: "**/*.gradle.kts"
      - name: Run headless tests before GUI smoke capture
        run: ./gradlew --no-daemon test
      - name: Install virtual display utilities
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick x11-utils
      - name: Launch the application and capture its window
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x900x24" bash -euo pipefail -c '
            ./gradlew --no-daemon run > /tmp/logicbench-launch.log 2>&1 &
            app_pid=$!
            cleanup() {
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            ready=0
            for attempt in $(seq 1 60); do
              if xwininfo -root -tree 2>/dev/null | grep -q "LogicBench"; then
                ready=1
                break
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat /tmp/logicbench-launch.log
                exit 1
              fi
              sleep 1
            done

            if [[ "$ready" -ne 1 ]]; then
              cat /tmp/logicbench-launch.log
              exit 1
            fi

            sleep 1
            import -window root /tmp/logicbench-m2.png
          '
      - name: Upload M2 window screenshot
        uses: actions/upload-artifact@v4
        with:
          name: logicbench-m2-window
          path: /tmp/logicbench-m2.png
          if-no-files-found: error
          retention-days: 14
